[workspace]
members = ["crates/vllm-oxide", "crates/vllm-oxide-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/RedHeartSecretMan/vllm-oxide"
authors = ["vllm-oxide contributors"]

[workspace.lints.rust]
# `deny` (not `forbid`) so narrowly-scoped modules can opt back in via
# `#![allow(unsafe_code)]` where genuinely unavoidable. Known sites:
#   - `vllm_oxide::loader` — candle's `ShardedSafeTensors::var_builder` is
#     `unsafe` (inherited from `memmap2::MmapOptions`).
#   - `vllm_oxide::attention::flash_attn` (T4) — `extern "C"` FFI to CUDA
#     kernels via candle's re-exported cudarc.
# Each opt-in module MUST document its unsafe boundary at the top of the file.
# `forbid` was the scaffold's conservative default; T15 is the first ticket
# to actually need the override.
unsafe_code = "deny"

[workspace.lints.clippy]
# `warn` rather than `deny` so CI surfaces issues without blocking exploration;
# promote to `deny` post-v0.1 once the lints are observed clean.
cast_possible_truncation = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
