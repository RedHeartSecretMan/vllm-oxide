# vllm-oxide dependency audit configuration (cargo-deny 0.20.2)
#
# This file is the supply-chain quality gate for the vllm-oxide workspace.
# It complements the existing clippy+fmt CI by checking vulnerabilities,
# licenses, duplicate crates, and allowed sources.
#
# Generated by `cargo deny init` and customized per the project's dependency
# profile. See https://embarkstudios.github.io/cargo-deny/ for reference.

# ── Root options ──────────────────────────────────────────────────────────────
[graph]
# Linux-only project (CUDA requirement). Check only x86-64 Linux targets.
targets = [
    "x86_64-unknown-linux-gnu",
]
# Do NOT enable all-features: `cuda` feature is GPU-only and pulls in
# candle-flash-attn from git + kernel compilation metadata that is irrelevant
# for a supply-chain audit. The default (CPU-only) feature set is the correct
# scope for CI.
all-features = false
no-default-features = false

[output]
feature-depth = 1

# ── Advisories ────────────────────────────────────────────────────────────────
# Fetches the RUSTSEC advisory database on first run.
[advisories]
# db-path = "$CARGO_HOME/advisory-dbs"
# db-urls = ["https://github.com/rustsec/advisory-db"]
# One advisory is consciously ignored (documented below); every other RUSTSEC
# finding is surfaced for human review.
ignore = [
    # paste@1.0.15 — MAINTENANCE advisory (crate archived by its author, dtolnay),
    # NOT a security vulnerability. paste is a tiny, frozen, correct proc-macro;
    # 1.0.15 is its final release with no upgrade path. It reaches us only
    # transitively via candle-core → gemm / tokenizers / pulp. Reconsider if candle
    # ever drops it or a real vulnerability is published against it.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained (not a vulnerability); final release, no upgrade; transitive via candle-core → gemm" },
]

# ── Licenses ──────────────────────────────────────────────────────────────────
# Allow list is set to the REAL permissive license set detected via
# `cargo deny list -l license`. Copyleft licenses (LGPL) are NOT allowed
# and will be flagged.
[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "Unlicense",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    # NOTE: MPL-2.0 is a weak file-level copyleft. It is not GPL/AGPL/LGPL.
    # option-ext@0.2.0 is the only dep using it. Accepted because MPL-2.0 is
    # standard in the Rust ecosystem and not in the project's prohibited set.
    # See deny.toml inline comment for rationale.
    #
    # NOT allowed (copyleft):
    # LGPL-2.1-or-later — used by r-efi@5.3.0, r-efi@6.0.0. FLAGGED below.
]
confidence-threshold = 0.8

# No per-crate exceptions needed. r-efi (LGPL-2.1-or-later) exists in the
# Cargo.lock but is filtered out on x86_64-unknown-linux-gnu target.
# See the full findings report for details on copyleft license analysis.
# exceptions = []

# License clarifications for crates whose license metadata is ambiguous
#[[licenses.clarify]]
#crate = "example"
#expression = "MIT OR Apache-2.0"
#license-files = [
#    { path = "LICENSE", hash = 0x01234567 }
#]

[licenses.private]
ignore = false

# ── Bans ──────────────────────────────────────────────────────────────────────
[bans]
# Warn on duplicate versions rather than hard-failing, because the Rust
# ecosystem commonly has unavoidable duplicates (e.g., two semver-incompatible
# major versions of the same crate both being pulled in by different deps).
multiple-versions = "warn"
# Wildcard version requirements are unusual in a workspace that pins versions;
# allow (no action needed).
wildcards = "allow"
# Highlight both lowest-version and simplest-path in duplicate diagnostics.
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow-workspace = true

# Specific denied crates
deny = [
    # Uncomment to block a crate entirely:
    # { crate = "openssl-sys", reason = "Project policy: no OpenSSL dependency" },
]

# Duplicate skip list: crates known to have legitimate duplicate versions
# that cannot be resolved without upstream changes
skip = [
    # Multiple semver-incompatible versions co-existing is normal
]
skip-tree = [
    # Use for crates whose entire transitive dep tree has duplicates at known
    # depths, e.g.:
    #{ crate = "syn@2.0.119", depth = 5 },
]

# ── Sources ───────────────────────────────────────────────────────────────────
[sources]
unknown-registry = "deny"
unknown-git = "deny"
# crates.io is the primary registry
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# huggingface/candle is pinned to git rev 27f20fea — this is intentional,
# documented in crates/vllm-oxide/Cargo.toml cross-cutting-risk comment.
# Without this entry, the sources check rejects it.
allow-git = ["https://github.com/huggingface/candle.git"]

# No org-level source allowances needed: the single git dependency
# (huggingface/candle) is covered by allow-git above.
