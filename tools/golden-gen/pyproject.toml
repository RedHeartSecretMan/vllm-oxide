[project]
name = "golden-gen"
version = "0.1.0"
description = "Golden fixture generator for vllm-oxide oracle triangle"
requires-python = ">=3.12,<3.13"
classifiers = [
    "Private :: Do Not Upload",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.26",
    "safetensors>=0.4.0",
    "pydantic>=2.5",
    "huggingface-hub>=0.20",
]

[project.scripts]
golden-gen = "golden_gen.cli:main"

[project.optional-dependencies]
gpu = [
    "transformers>=4.56.0,<6.0",
    "vllm>=0.18.0,<0.19.0",
    "torch>=2.10.0,<2.11.0",
    "xgrammar>=0.1.32,<0.2.4",
]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv]
package = true

[tool.uv.sources]
# nano-vllm requires flash-attn which has no pre-built wheel for CUDA 13.x.
# Run with --only-oracle transformers,vllm_v1 instead, or add back when
# a CUDA 13-compatible flash-attn wheel is available.
# nano-vllm = { git = "https://github.com/GeeeekExplorer/nano-vllm" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["nanovllm.*", "vllm.*", "transformers.*", "torch.*", "xgrammar.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
