name: Documentation issue
description: Report a missing, unclear or incorrect instruction or example.
title: "[Docs] "
labels: [documentation, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        English and Chinese are both welcome / 欢迎使用中文或英文。
        Small corrections can also be sent directly as a pull request. No GPU validation is needed for a wording or link fix.
        Use the [documentation index](https://github.com/RedHeartSecretMan/vllm-oxide/blob/main/docs/README.md) to find the current usage and release guides.
  - type: input
    id: location
    attributes:
      label: Page or file
      description: Link the page and heading or give the file path. Include the release version and documentation language when relevant.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear or incorrect?
      description: Describe the missing or incorrect instruction. For a failing example, include the command and relevant error. Remove sensitive information.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      description: Describe the correction or example that would have helped. An implementation is optional.
