name: Bug report
description: Report an error or unexpected behavior with a minimal reproduction.
title: "[Bug] "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        English and Chinese are both welcome / 欢迎使用中文或英文。
        Search existing issues first and check [SUPPORT.md](https://github.com/RedHeartSecretMan/vllm-oxide/blob/main/SUPPORT.md).
        Report security vulnerabilities privately using [SECURITY.md](https://github.com/RedHeartSecretMan/vllm-oxide/blob/main/SECURITY.md).
        Remove access tokens and sensitive prompts. Model weights and raw validation packages are not required.
  - type: input
    id: version
    attributes:
      label: Version or source commit
      description: Include the release tag or exact source commit and whether you have local changes.
      placeholder: v0.2.0, or an exact commit hash
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Paste a runnable command or small Rust example, including build features and required setup. Use a shareable prompt or token IDs for inference issues.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Describe the error, incorrect result or performance change. For a regression, give the comparison version and the same workload/configuration.
    validations:
      required: true
  - type: textarea
    id: model
    attributes:
      label: Model identity
      description: For inference issues, give the model ID, immutable revision, dtype and whether the source is a Hub snapshot or local directory. Otherwise use not applicable.
      placeholder: |
        Model ID: Qwen/Qwen3-0.6B
        Revision:
        Dtype: BF16 (or the actual dtype)
        Source: Hub snapshot or local directory
  - type: textarea
    id: environment
    attributes:
      label: Environment and build
      description: Give OS details and the build command/features. Include GPU details for CUDA issues; use not applicable for CPU-only checks.
      placeholder: |
        OS and kernel (include WSL2 if applicable):
        Rust version:
        Build command and features:
        GPU and VRAM:
        NVIDIA driver:
        CUDA toolkit:
    validations:
      required: true
  - type: textarea
    id: configuration
    attributes:
      label: Generation and engine configuration
      description: Include sampling settings, prompt/completion token limits, batch size and EngineOptions. Use not applicable for build or tooling issues.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste the relevant error or output, with sensitive information removed. Include workload and timing/memory measurements for performance reports; a full evidence archive is not needed.
      render: text
