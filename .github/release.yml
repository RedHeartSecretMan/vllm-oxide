# Change-type labels group generated notes; triage labels describe readiness.
# Keep the final wildcard category last so uncategorized changes remain visible.
changelog:
  categories:
    - title: Breaking changes
      labels: [breaking-change]
    - title: Features and improvements
      labels: [enhancement]
    - title: Fixes
      labels: [bug]
    - title: Documentation
      labels: [documentation]
    - title: Maintenance
      labels: ["*"]
