name: Documentation

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/docs.yml'
      - 'tools/check_docs.py'
      - 'tools/test_check_docs.py'
  pull_request:
    paths:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/docs.yml'
      - 'tools/check_docs.py'
      - 'tools/test_check_docs.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Test the documentation checker
        run: python3 -m unittest discover -s tools -p test_check_docs.py
      - name: Check local documentation links
        run: python3 tools/check_docs.py
