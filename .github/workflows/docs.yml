name: Documentation

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/docs.yml'
      - 'crates/vllm-oxide/**'
      - 'tools/check_docs.py'
      - 'tools/test_check_docs.py'
  pull_request:
    paths:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/docs.yml'
      - 'crates/vllm-oxide/**'
      - 'tools/check_docs.py'
      - 'tools/test_check_docs.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Test the documentation checker
        run: python3 -m unittest discover -s tools -p test_check_docs.py
      - name: Check local documentation links
        run: python3 tools/check_docs.py

  api:
    name: Public Rust API documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: public-api-docs
      - name: Build public API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked -p vllm_oxide --no-deps
