name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          cache: cargo

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  deps:
    name: Dependency audit (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Supply-chain gate: vulnerabilities, licenses, duplicate crates, allowed
      # sources — policy lives in deny.toml. A newly-published RUSTSEC advisory
      # fails this job; that is the intended early-warning behaviour.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
