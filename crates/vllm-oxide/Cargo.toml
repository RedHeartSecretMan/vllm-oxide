[package]
name = "vllm_oxide"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "A Rust port of nano-vllm trending toward vLLM's V1 architecture (single-GPU, Qwen3-focused, offline LLM inference)."

[lib]
name = "vllm_oxide"
path = "src/lib.rs"

[features]
cuda = ["dep:candle-flash-attn", "candle-core/cuda"]

[dependencies]
candle-core = { git = "https://github.com/huggingface/candle.git", rev = "27f20fea993c81ea6d32ce44018f42b68466525e" }
candle-flash-attn = { git = "https://github.com/huggingface/candle.git", rev = "27f20fea993c81ea6d32ce44018f42b68466525e", optional = true }
rand = "0.8"
rand_distr = "0.4"

[build-dependencies]
cudaforge = "0.1"
anyhow = "1"

[lints]
workspace = true
