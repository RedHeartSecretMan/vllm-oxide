[package]
name = "vllm_oxide"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Distributed through Git source and GitHub Releases; not crates.io.
publish = false
description = "A release candidate of the vllm-oxide large language model inference engine in Rust and CUDA."
readme = "../../README.md"
documentation = "https://github.com/RedHeartSecretMan/vllm-oxide/blob/v0.2.0.rc.1/docs/getting-started.md"

[lib]
name = "vllm_oxide"
path = "src/lib.rs"

[features]
# Default = CPU-only. Tests and dev iteration run without CUDA. Production
# callers (the CLI, the engine in T2) enable `cuda` to get the real backend.
default = []
# Enables `candle-core/cuda` + pulls in the optional `candle-flash-attn`
# dependency (#18 attention). Off by default so `cargo test` runs on CI
# without a GPU. Production callers pass `--features cuda`.
cuda = ["dep:candle-flash-attn", "candle-core/cuda"]
# Unsupported, default-off release-tooling hook. It adds no public Rust item;
# ADR-0011 defines the process-scoped capture contract.
internal-golden = ["dep:rustix", "dep:sha2"]

[dependencies]
# Pinned to rev `27f20fea` per the parent spec #12 cross-cutting risk note
# ("candle-flash-attn paged API depends on PR #3655; prototype validated at
# 27f20fea on sm_89 + CUDA 13.2 — T10"). That rev includes the paged
# windowed-attn PR so the attention/ module lands later without a rev bump.
# Coordinating bump across candle-core / candle-nn / candle-flash-attn is
# a deliberate act, not a casual one.
candle-core = { git = "https://github.com/huggingface/candle.git", rev = "27f20fea993c81ea6d32ce44018f42b68466525e" }
candle-nn = { git = "https://github.com/huggingface/candle.git", rev = "27f20fea993c81ea6d32ce44018f42b68466525e" }
candle-flash-attn = { git = "https://github.com/huggingface/candle.git", rev = "27f20fea993c81ea6d32ce44018f42b68466525e", optional = true }

# Synchronous Hub API for the engine's construction contract. Keep this API
# version aligned with the pinned checkpoint loader and its offline cache tests.
# `default-features = false` + `ureq` avoids the default `native-tls` (openssl)
# dependency — ureq 3.x uses rustls by default, which has no system-library
# requirement and lets `cargo check` run on a bare CI runner.
hf-hub = { version = "0.5", default-features = false, features = ["ureq"] }

# Gumbel-max sampling noise source (T17).
rand = "0.8"
rand_distr = "0.4"

half = "2"

anyhow = "1"
serde = { version = "1", features = ["derive"] }
# Private evidence self-checks require exact f64 -> JSON -> f64 identity.
serde_json = { version = "1", features = ["float_roundtrip"] }
tracing = "0.1"
rustix = { version = "1", features = ["fs", "process"], optional = true }
sha2 = { version = "0.10", optional = true }

# XXH64 for BlockPool's chained prefix-cache hash (nano-vllm parity).
# Pure-Rust, no unsafe surfaced; workspace `unsafe_code = "deny"` respected.
twox-hash = "2"

inventory = "0.3"

# Rust-side tokenizer (no Python AutoTokenizer dep). Contract: "round-trips
# Qwen3's BPE". Loads tokenizer.json from the model directory.
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }

[dev-dependencies]
# Used by loader tests to materialise throwaway safetensors fixtures.
tempfile = "3"
# Test-only writes of safetensors files; matches candle's pinned rev so the
# on-disk format is identical to what candle reads back.
safetensors = "0.4"

[build-dependencies]
cudaforge = "0.1"
anyhow = "1"

[lints]
workspace = true
