[package]
name = "vllm_oxide_test"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Golden comparison crate — release gate that validates the Rust engine against golden fixtures (NOT a CI gate)."
publish = false

[[bin]]
name = "vllm-oxide-test"
path = "src/main.rs"

[features]
cuda = ["vllm_oxide/cuda"]

[dependencies]
vllm_oxide = { path = "../vllm-oxide", features = ["internal-golden"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
flate2 = "1"
rustix = { version = "1", features = ["fs"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
bytemuck = "1"
safetensors = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
