[package]
name = "vllm_oxide_cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Thin CLI binary for vllm-oxide — parses argv and calls LLM::generate."

[dependencies]
# Issue #24 — thin CLI over LLM::generate. No tokio; LLM::generate is sync.
vllm_oxide = { path = "../vllm-oxide" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[lints]
workspace = true
