[package]
name = "vllm_oxide_cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Distributed through Git source and GitHub Releases; not crates.io.
publish = false
description = "Command-line Qwen3 offline generation through vllm-oxide's synchronous Rust API."
readme = "../../README.md"
documentation = "https://github.com/RedHeartSecretMan/vllm-oxide/blob/v0.1.0/docs/getting-started.md"

[dependencies]
# Issue #24 — thin CLI over LLM::generate. No tokio; LLM::generate is sync.
vllm_oxide = { path = "../vllm-oxide" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[lints]
workspace = true
